name: CI

# Both names are listed deliberately. The local default branch is `master`
# and this file previously triggered only on `main`, so every push ran zero
# checks and the absence of a red X looked like a green build. Listing both
# makes the trigger independent of which name the remote ended up with.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov=app tests/ -v

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Audit dev/test dependencies
        run: pip-audit -r requirements-dev.txt
