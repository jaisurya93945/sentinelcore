name: Release to PyPI

# Trusted Publishing (OIDC). No API token is stored anywhere -- not in
# repository secrets, not on a developer machine, not in a chat log.
# GitHub proves the workflow's identity to PyPI directly. For a security
# tool, a release pipeline that requires a long-lived credential sitting in
# a secrets store is the wrong default.
#
# One-time setup on PyPI (Your projects -> Publishing -> Add a pending publisher):
#   PyPI project name : sentinelcore-ai   <- the DISTRIBUTION name
#   Owner             : jaisurya93945
#   Repository        : sentinelcore      <- the GitHub repo, not renamed
#   Workflow          : release.yml
#   Environment       : pypi
#
# The first two differ on purpose: PyPI refuses `sentinelcore` because
# `sentinel-core` already exists and its similarity check treats the two as
# the same name. See docs/RELEASE.md. A publisher registered under the old
# name authorizes nothing, because the upload is a different project.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  # Gate first. A release that skips the test suite is how a broken version
  # becomes permanent -- PyPI does not allow re-uploading a version number.
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this the matrix aborts on the first failure, so a break on
      # 3.11 hides whether 3.12 and 3.13 are also broken -- exactly the
      # diagnosis you want when deciding whether to hold a release.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,ml]"

      # A SKIP IS NOT A PASS, and it matters more here than in CI: this job
      # is the only gate in front of an upload that can never be undone. If
      # the ml extra ever fails to install, the learned-detector tests would
      # skip and this gate would go green having tested none of them.
      - run: pytest tests/ -q
        env:
          SENTINELCORE_REQUIRE_ML: "1"
      - name: Verify the package imports from a clean install
        run: |
          pip install build && python -m build --wheel -o dist/
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import sentinelcore; print(sentinelcore.__version__)"
          /tmp/clean/bin/sentinel doctor

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match pyproject version $PKG"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI only. A rehearsal you cannot repeat is not much of a
          # rehearsal: without this, the second dispatch of the same version
          # dies on "File already exists" and you have to bump the version
          # just to re-test. Deliberately NOT set on the real PyPI job
          # below, where an already-published version must be a hard stop.
          skip-existing: true

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
