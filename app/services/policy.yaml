# Default SentinelCore policy.
# Two layers, most-severe-decision-wins -- see policy_engine.py.
version: 1

rules:
  instruction_override: block
  role_manipulation: block
  system_prompt_extraction: warn
  mixed_script_homoglyph: warn
  encoded_payload_suspected: warn
  entity_encoding_obfuscation: warn
  zero_width_characters: sanitize
  bidi_control_characters: sanitize
  unusual_whitespace: sanitize
  control_characters: sanitize
  character_spacing_evasion: sanitize
  # Secrets: unambiguous credentials -- no safe partial fix, block outright.
  aws_access_key: block
  private_key: block
  generic_api_key: block
  db_connection_string: block
  jwt_token: warn
  bearer_token: warn
  # PII: sensitive identifiers block; common/low-stakes fields warn --
  # blocking every email mention would make the gateway useless for
  # ordinary support/contact use cases.
  ssn: block
  credit_card: block
  email_address: warn
  phone_number: warn
  ip_address: warn
  oracle_injection: warn
  # Learned-classifier findings default to WARN: a probabilistic detector
  # firing is not on its own grounds to block, which is precisely why
  # provenance has something to decide.
  ml_injection: warn

# Origin-conditioned rules, checked BEFORE the flat rules above.
# Key format: <finding_type>@<origin_prefix>
#
# These exist because of a measured negative result: origin-weighted
# SCORING changed nothing, because the categorical rules above fire
# regardless of score (docs/research/README.md, Finding 2). Provenance
# only changes behaviour if it conditions the rule itself.
#
# Two directions, both deliberate:
#   - ESCALATE for untrusted origins: the same text is more dangerous
#     arriving from a retrieved document or a model-generated tool
#     argument than from the user's own keyboard.
#   - RELAX for the user's own input: a person asking their own
#     assistant "what are your instructions?" is curiosity, not an
#     attack, and blocking it is a pure utility cost. This direction is
#     what makes the rules a real trade-off rather than a one-way
#     ratchet that only ever blocks more.

origin_rules:
  # Experimental oracle detector (scripts/run_ablation.py only -- never
  # registered in the running system). Its flat rule is WARN; these
  # escalate it by provenance. This isolates whether provenance can
  # safely trade permissiveness on the user's own input for strictness
  # on external content.
  oracle_injection@context: block
  oracle_injection@tool_response: block
  oracle_injection@tool_description: block
  oracle_injection@tool_arguments: block
  oracle_injection@input: warn
  ml_injection@context: block
  ml_injection@tool_response: block
  ml_injection@tool_description: block
  ml_injection@tool_arguments: block
  ml_injection@input: warn
  # Someone else's text telling the model what to do -- always block.
  system_prompt_extraction@context: block
  system_prompt_extraction@tool_response: block
  system_prompt_extraction@tool_description: block
  # The user asking about their own assistant's configuration is not an
  # attack. Downgraded from the flat `warn` to allow.
  system_prompt_extraction@input: allow
  # Obfuscation in external content is far more suspicious than a stray
  # unicode character in something a human typed.
  mixed_script_homoglyph@context: block
  mixed_script_homoglyph@tool_description: block
  encoded_payload_suspected@tool_arguments: block

thresholds:
  block: 70
  sanitize: 50
  warn: 25
