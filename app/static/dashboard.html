<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelCore — Audit Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg-elevated: #12172a;
    --bg-elevated-2: #171d36;
    --border: #232b4a;
    --indigo: #6366f1;
    --cyan: #22d3ee;
    --text: #e4e7f1;
    --text-dim: #8b92b0;
    --text-faint: #545c7a;

    --c-allow: #34d399;
    --c-warn: #facc15;
    --c-sanitize: #a78bfa;
    --c-human_approval: #fb923c;
    --c-block: #f43f5e;

    --c-allow-tint: rgba(52,211,153,0.12);
    --c-warn-tint: rgba(250,204,21,0.12);
    --c-sanitize-tint: rgba(167,139,250,0.12);
    --c-human_approval-tint: rgba(251,146,60,0.12);
    --c-block-tint: rgba(244,63,94,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(99,102,241,0.12), transparent),
      radial-gradient(ellipse 700px 400px at 100% 0%, rgba(34,211,238,0.08), transparent);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

  .subtitle { color: var(--text-dim); font-size: 12.5px; margin: 0 0 32px; }

  .live-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--cyan);
    border: 1px solid rgba(34,211,238,0.35);
    background: rgba(34,211,238,0.06);
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .stat {
    background: var(--bg-elevated);
    padding: 16px 14px;
    text-align: left;
  }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .stat[data-k="allow"] .stat-num { color: var(--c-allow); }
  .stat[data-k="warn"] .stat-num { color: var(--c-warn); }
  .stat[data-k="sanitize"] .stat-num { color: var(--c-sanitize); }
  .stat[data-k="human_approval"] .stat-num { color: var(--c-human_approval); }
  .stat[data-k="block"] .stat-num { color: var(--c-block); }

  .panel-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-label::after { content: ""; height: 1px; flex: 1; background: var(--border); }

  .empty {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 40px 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
  }
  .empty code {
    background: var(--bg-elevated-2);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--cyan);
    font-size: 12px;
  }

  .log { display: flex; flex-direction: column; gap: 1px; }

  .entry {
    display: grid;
    grid-template-columns: 108px 90px 1fr 130px 56px;
    align-items: center;
    gap: 16px;
    background: var(--bg-elevated);
    border-left: 3px solid var(--text-faint);
    padding: 11px 16px;
    font-size: 12.5px;
    animation: rise 0.35s ease both;
  }
  .entry[data-d="allow"] { border-left-color: var(--c-allow); }
  .entry[data-d="warn"] { border-left-color: var(--c-warn); }
  .entry[data-d="sanitize"] { border-left-color: var(--c-sanitize); }
  .entry[data-d="human_approval"] { border-left-color: var(--c-human_approval); }
  .entry[data-d="block"] { border-left-color: var(--c-block); }

  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

  .t-time { color: var(--text-faint); font-size: 11.5px; }
  .t-endpoint { color: var(--text-dim); font-size: 11px; }
  .t-findings { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-findings .type { color: var(--text); }
  .t-findings .none { color: var(--text-faint); font-style: italic; }

  .t-decision {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    justify-self: start;
  }
  .t-decision[data-d="allow"] { color: var(--c-allow); }
  .t-decision[data-d="warn"] { color: var(--c-warn); }
  .t-decision[data-d="sanitize"] { color: var(--c-sanitize); }
  .t-decision[data-d="human_approval"] { color: var(--c-human_approval); }
  .t-decision[data-d="block"] { color: var(--c-block); }

  .t-risk { justify-self: end; }
  .risk-chip {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 5px;
    min-width: 26px;
    text-align: center;
  }

  footer { margin-top: 32px; color: var(--text-faint); font-size: 11px; line-height: 1.8; }
  footer a { color: var(--text-dim); }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .entry { grid-template-columns: 1fr; gap: 4px; text-align: left; }
    .t-risk, .t-decision { justify-self: start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>SentinelCore <span style="color:var(--text-faint); font-weight:500;">/ audit recorder</span></h1>
    <span class="live-tag">● LIVE</span>
  </header>
  <p class="subtitle">Read-only transcript of every scan decision. Metadata only — no raw text, no finding evidence, ever recorded.</p>

  <div class="stats" id="stats"></div>

  <p class="panel-label">Recent activity</p>
  <div id="log-container"></div>

  <footer>
    Polls <code style="font-size:10px;">GET /api/v1/audit/recent</code> every 5s · v0.1.0-dev · <a href="/docs">API docs</a>
  </footer>
</div>

<script>
const DECISIONS = ["allow", "warn", "sanitize", "human_approval", "block"];
const LABELS = { allow: "Allow", warn: "Warn", sanitize: "Sanitize", human_approval: "Human", block: "Block" };

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour12: false }) ;
}

function renderStats(events) {
  const counts = Object.fromEntries(DECISIONS.map(d => [d, 0]));
  events.forEach(e => { if (counts[e.decision] !== undefined) counts[e.decision]++; });
  document.getElementById('stats').innerHTML = DECISIONS.map(d => `
    <div class="stat" data-k="${d}">
      <div class="stat-num">${counts[d]}</div>
      <div class="stat-label">${LABELS[d]}</div>
    </div>
  `).join('');
}

function renderLog(events) {
  const container = document.getElementById('log-container');
  if (events.length === 0) {
    container.innerHTML = `<div class="empty">
      No scans recorded yet.<br><br>
      Send a request to <code>POST /api/v1/scan</code>, <code>POST /v1/chat/completions</code>,
      <code>POST /api/v1/scan/tool-call</code>, or <code>POST /api/v1/scan/mcp-tools</code> to see activity here.
    </div>`;
    return;
  }
  container.innerHTML = `<div class="log">` + events.map(e => {
    let findingsText;
    if (e.findings.length) {
      findingsText = e.findings.slice(0, 3).map(f => `<span class="type">${f.type}</span>`).join(', ') + (e.findings.length > 3 ? ` +${e.findings.length - 3} more` : '');
    } else if (e.detail) {
      findingsText = `<span class="none">${e.detail} — no content findings</span>`;
    } else {
      findingsText = '<span class="none">no findings</span>';
    }
    const riskColor = `var(--c-${e.decision})`;
    const riskTint = `var(--c-${e.decision}-tint)`;
    return `
      <div class="entry" data-d="${e.decision}">
        <span class="t-time">${fmtTime(e.timestamp)}</span>
        <span class="t-endpoint">${e.endpoint}${e.detail ? ' · ' + e.detail : ''}</span>
        <span class="t-findings">${findingsText}</span>
        <span class="t-decision" data-d="${e.decision}">${LABELS[e.decision] || e.decision}</span>
        <span class="t-risk"><span class="risk-chip" style="color:${riskColor}; background:${riskTint}; border:1px solid ${riskColor};">${e.risk_score}</span></span>
      </div>`;
  }).join('') + `</div>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/v1/audit/recent?limit=30');
    const data = await res.json();
    renderStats(data.events);
    renderLog(data.events);
  } catch (err) {
    document.getElementById('log-container').innerHTML =
      `<div class="empty">Could not reach the audit API. Is the server running?</div>`;
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
