<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentinelCore</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --line:#21262d; --fg:#e6edf3; --dim:#7d8590;
    --c-allow:#3fb950; --c-warn:#d29922; --c-sanitize:#58a6ff;
    --c-human_approval:#bc8cff; --c-block:#f85149;
    --c-critical:#f85149; --c-high:#f85149; --c-medium:#d29922;
    --c-low:#58a6ff; --c-info:#7d8590;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:14px; padding:14px 20px;
           border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .brand { font-weight:600; letter-spacing:.3px; }
  .brand span { color:var(--dim); font-weight:400; margin-left:8px; }
  header input { background:var(--bg); border:1px solid var(--line); color:var(--fg);
                 padding:5px 9px; border-radius:6px; font:inherit; width:190px; }
  header .spacer { flex:1; }
  button { font:inherit; cursor:pointer; }
  .tabs { display:flex; gap:2px; padding:0 20px; border-bottom:1px solid var(--line);
          background:var(--panel); overflow-x:auto; }
  .tab { background:none; border:none; color:var(--dim); padding:10px 14px;
         border-bottom:2px solid transparent; white-space:nowrap; }
  .tab.active { color:var(--fg); border-bottom-color:var(--c-sanitize); }
  .tab:hover { color:var(--fg); }
  #pause { background:var(--bg); border:1px solid var(--line); color:var(--dim);
           padding:5px 11px; border-radius:6px; }
  #pause.paused { color:var(--c-warn); border-color:var(--c-warn); }
  main { padding:18px 20px 40px; max-width:1180px; }
  .stats { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:9px 14px; min-width:92px; }
  .stat .n { display:block; font-size:19px; font-weight:600; }
  .stat .l { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .stat[data-d=allow] .n { color:var(--c-allow); }
  .stat[data-d=warn] .n { color:var(--c-warn); }
  .stat[data-d=sanitize] .n { color:var(--c-sanitize); }
  .stat[data-d=human_approval] .n { color:var(--c-human_approval); }
  .stat[data-d=block] .n { color:var(--c-block); }
  .list { display:flex; flex-direction:column; gap:1px; }
  .row { display:grid; grid-template-columns:78px 104px 46px 128px 1fr auto;
         gap:10px; align-items:center; padding:7px 10px; background:var(--panel);
         border-left:2px solid var(--line); }
  .row[data-d=allow]{border-left-color:var(--c-allow)}
  .row[data-d=warn]{border-left-color:var(--c-warn)}
  .row[data-d=sanitize]{border-left-color:var(--c-sanitize)}
  .row[data-d=human_approval]{border-left-color:var(--c-human_approval)}
  .row[data-d=block]{border-left-color:var(--c-block)}
  .time,.endpoint,.risk { color:var(--dim); }
  .decision { text-transform:uppercase; font-size:11px; letter-spacing:.4px; }
  .row[data-d=block] .decision { color:var(--c-block); }
  .row[data-d=human_approval] .decision { color:var(--c-human_approval); }
  .row[data-d=sanitize] .decision { color:var(--c-sanitize); }
  .row[data-d=warn] .decision { color:var(--c-warn); }
  .row[data-d=allow] .decision { color:var(--c-allow); }
  .chip { background:var(--bg); border:1px solid var(--line); border-radius:4px;
          padding:1px 6px; margin-right:5px; font-size:11px; }
  .chip.ok { color:var(--c-allow); border-color:var(--c-allow); }
  .chip.err { color:var(--c-block); border-color:var(--c-block); }
  .more,.none,.hint { color:var(--dim); font-size:11px; }
  .link { background:none; border:none; color:var(--dim); text-decoration:underline; padding:0; }
  .link:hover { color:var(--c-sanitize); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:13px 15px; }
  .card[data-sev=high]{border-left:3px solid var(--c-high)}
  .card[data-sev=medium]{border-left:3px solid var(--c-medium)}
  .card[data-sev=info]{border-left:3px solid var(--c-info)}
  .card-head { display:flex; align-items:center; gap:9px; margin-bottom:5px; }
  .sev { font-size:10px; text-transform:uppercase; letter-spacing:.6px;
         padding:1px 6px; border-radius:4px; background:var(--bg); }
  .meta { color:var(--dim); font-size:11px; }
  .card p { margin:8px 0 0; }
  .actions { display:flex; align-items:center; gap:9px; margin-top:11px; flex-wrap:wrap; }
  .btn { background:var(--bg); border:1px solid var(--line); color:var(--fg);
         padding:5px 13px; border-radius:6px; }
  .btn.ok:hover { border-color:var(--c-allow); color:var(--c-allow); }
  .btn.danger:hover { border-color:var(--c-block); color:var(--c-block); }
  .empty { text-align:center; padding:44px 20px; color:var(--dim); }
  .empty p { margin:5px 0; }
  .warn-note { color:var(--c-warn); }
  .notice { position:fixed; bottom:0; left:0; right:0; padding:11px 20px;
            transform:translateY(100%); transition:transform .18s; background:var(--panel);
            border-top:1px solid var(--line); }
  .notice.show { transform:translateY(0); }
  .notice.ok { border-top-color:var(--c-allow); }
  .notice.warn { border-top-color:var(--c-warn); }
  .notice.err { border-top-color:var(--c-block); }
  footer { padding:14px 20px 26px; color:var(--dim); font-size:11px; max-width:1180px; }
</style>
</head>
<body>
<header>
  <div class="brand">SentinelCore<span>control plane</span></div>
  <div class="spacer"></div>
  <input id="apikey" type="password" placeholder="X-API-Key (if enabled)" autocomplete="off">
  <button id="pause">Pause</button>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="activity">Activity</button>
  <button class="tab" data-tab="approvals">Approvals</button>
  <button class="tab" data-tab="mcp">MCP changes</button>
  <button class="tab" data-tab="health">Health</button>
</nav>

<main><div id="panel"></div></main>

<footer>
  Read-only except for approval decisions, change acknowledgement and feedback.
  Reporting a decision as wrong records the scan id and a verdict &mdash; never the scanned text.
  Attaching text is a separate, admin-only action.
</footer>

<div id="notice" class="notice"></div>
<script src="/static/dashboard.js"></script>
</body>
</html>
